services:

  redis:
    image: redis:7.0.14-alpine
    restart: unless-stopped
    container_name: redis
    volumes:
      - redis_data:/data


  django:
    container_name: django_manage_restaurant
    restart: unless-stopped
    build: .
    image: ghcr.io/alfred-t-y/manage_restaurant_django
    entrypoint: ./entrypoint.sh
    command: >
      gunicorn manage_restaurant_api.asgi:application
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      --workers 3
      --worker-connections 1000
      --timeout 120
      --graceful-timeout 30
      --log-level info
    volumes: 
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DEBUG=True
      - SECRET_KEY
      - EMAIL_HOST_USER 
      - EMAIL_HOST_PASSWORD
      - TWILIO_PHONENUMBER
      - TWILIO_SID
      - TWILIO_TOKEN
      - POSTGRES_HOST
      - POSTGRES_PORT
      - SUPERUSER_NAME
      - SUPERUSER_PASSWORD
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    container_name: celery_manage_restaurant
    restart: unless-stopped
    build: .
    command: celery --app=manage_restaurant_api worker -l INFO
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DEBUG
      - SECRET_KEY
      - EMAIL_HOST_USER 
      - EMAIL_HOST_PASSWORD
      - TWILIO_PHONENUMBER
      - TWILIO_SID
      - TWILIO_TOKEN
      - POSTGRES_HOST
      - POSTGRES_PORT
    depends_on:
      - redis

  db:
    image: postgres:15
    restart: unless-stopped
    container_name: db
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST_AUTH_METHOD
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d managerestaurantdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgbouncer:
    image: bitnami/pgbouncer:1.24.1-debian-12-r10
    container_name: pgbouncer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "6432"
    environment: 
      - PGBOUNCER_AUTH_TYPE
      - PGBOUNCER_AUTH_QUERY
      - PGBOUNCER_AUTH_USER
      - POSTGRESQL_HOST
      - POSTGRESQL_PORT
      - POSTGRESQL_USERNAME
      - POSTGRESQL_PASSWORD
      - POSTGRESQL_DATABASE
      - PGBOUNCER_DATABASE
      - PGBOUNCER_LISTEN_PORT
      - PGBOUNCER_POOL_MODE
      - PGBOUNCER_MAX_CLIENT_CONN
      - PGBOUNCER_MAX_DB_CONNECTIONS
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/6432' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build: 
      context: .      
      dockerfile: nginx/Dockerfile 
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_data:/static:ro
      - media_data:/app/media
    depends_on:
      - django


volumes:
  pgdata:
  redis_data:
  static_data:
  media_data: