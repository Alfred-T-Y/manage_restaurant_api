services:

  redis:
    image: redis:7.0.14-alpine
    restart: unless-stopped
    container_name: redis
    volumes:
      - redis_data:/data


  django:
    container_name: django_manage_restaurant
    restart: unless-stopped
    build: .
    image: ghcr.io/alfred-t-y/manage_restaurant_django
    entrypoint: ./entrypoint.sh
    command: >
      gunicorn manage_restaurant_api.asgi:application
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      --workers 3
      --worker-connections 1000
      --timeout 120
      --graceful-timeout 30
      --log-level info
    volumes: 
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started


  celery:
    container_name: celery_manage_restaurant
    restart: unless-stopped
    build: .
    image: ghcr.io/alfred-t-y/manage_restaurant_celery
    command: celery --app=manage_restaurant_api worker -l INFO
    env_file:
      - .env
    depends_on:
      - redis


  db:
    image: postgres:15
    restart: unless-stopped
    container_name: db
    env_file:  
      - .env 
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d managerestaurantdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data


  pgbouncer-init:
    build: 
        context: pgbouncer-init      
        dockerfile: Dockerfile 
    container_name: pgbouncer-init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgbouncer_config:/pgconf
    command: >
      sh -c '
        apk add --no-cache postgresql-client &&
        mkdir -p /pgconf &&
        echo "Génération de users.txt..." &&
        psql -h db -U admin -d managerestaurantdb -t -A -c \
        "SELECT '\''\"'\'' || usename || '\''\" \"'\'' || passwd || '\''\"'\'' FROM pg_shadow WHERE usename = '\''admin'\'';" \
        > /pgconf/users.txt &&
        echo "users.txt généré avec succès" &&
        exit 0
      '
    env_file:  
      - .env 


  pgbouncer:
    image: crunchydata/crunchy-pgbouncer:centos8-13.6-4.7.5
    container_name: pgbouncer
    restart: unless-stopped
    depends_on:
      pgbouncer-init:
        condition: service_completed_successfully
    expose:
      - "6432"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/6432' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
    - pgbouncer_config:/pgconf
    env_file:  
      - .env       

  nginx:
    build: 
      context: nginx     
      dockerfile: Dockerfile 
    container_name: nginx
    restart: unless-stopped
    image: ghcr.io/alfred-t-y/manage_restaurant_nginx
    ports:
      - "80:80"
    volumes:
      - static_data:/static:ro
      - media_data:/app/media
    depends_on:
      - django


volumes:
  pgdata:
  redis_data:
  media_data:
  static_data:
  pgbouncer_config:
#until [ -f /opt/bitnami/pgbouncer/conf/userlist.txt -a -f /opt/bitnami/pgbouncer/conf/pgbouncer.ini ]; do sleep 2; done